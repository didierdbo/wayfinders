repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        # Exception (Phase 6 L4): the resolution-head ONNX (~1.25 MB) is
        # the contract artefact OnnxClassifier composes with the encoder
        # and is intentionally tracked. Mirror of the .gitignore exception
        # below the same path. Ratified in the L4 pre-brief §11.6.
        exclude: ^client/ml/resolution-head-v0\.1\.onnx$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        files: ^wayfinders/
        additional_dependencies: [numpy>=1.26, types-python-slugify, fastapi>=0.115, pydantic>=2.0, torch>=2.0]
