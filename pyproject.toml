[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wayfinders"
version = "0.1.0"
description = "Indirect-command party-management RPG — game logic, rules, ML, prose renderers."
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Didier Bonnet" }]
dependencies = [
    "numpy>=1.26",
    "python-slugify>=8.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
rl = [
    "gymnasium>=0.29",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
# ML training stack — heavy, opt-in via `uv sync --extra ml`.
# Kept out of the default dependency set so a fresh `uv sync` stays light
# (CI / API-only workflows don't need to pull torch + transformers).
ml = [
    "torch>=2.4,<3.0",
    "sentence-transformers>=3.0,<4.0",
    "transformers>=4.42,<5.0",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["wayfinders"]

# ---------------------------------------------------------------------------
# PyTorch CUDA index — pin torch on cu124 so that `uv sync --all-extras --dev`
# never silently falls back to the +cpu build from PyPI.
#
# Background: on Windows, PyPI serves torch +cpu by default when no explicit
# index is provided.  The cu124 wheel works on machines without a GPU (CUDA
# simply won't be available), so the trade-off is safe: dev machines get CUDA,
# CI / CPU-only clones still install fine.
#
# `explicit = true` keeps uv from routing *other* packages through this index
# (the PyTorch index only hosts a limited set of packages).
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu124"
url  = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "integration: requires model download / network / slow I/O (run with -m integration)",
    "m2_only: test covers M2+ scope — skipped in M1 (recruit-only mode, §A.8.D3)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "web", "client", "scripts/probes"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RUF",
]
ignore = [
    "E501",  # line too long — formatter's job
    "B008",  # function call in default argument — fine for dataclass factories
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]
"scripts/**/*.py" = ["T201"]  # print() is fine in scripts

[tool.ruff.lint.isort]
known-first-party = ["wayfinders"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
files = ["wayfinders"]

[[tool.mypy.overrides]]
# Tests and scripts can be a notch looser; we still check them but don't gate on strict mode.
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# ML libs without bundled stubs.
module = [
    "torch.*",
    "sentence_transformers.*",
    "transformers.*",
    "onnx.*",
    "onnxruntime.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyYAML: stubs are in types-pyyaml (dev dep), but pre-commit mypy runs in
# its own isolated env without access to dev deps.  Suppress the missing-stub
# error here; the import is still type-checked at runtime via `uv run mypy`.
module = ["yaml"]
ignore_missing_imports = true
