[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wayfinders"
version = "0.1.0"
description = "Indirect-command party-management RPG — game logic, rules, ML, prose renderers."
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Didier Bonnet" }]
dependencies = [
    "numpy>=1.26",
    "python-slugify>=8.0",
]

[project.optional-dependencies]
rl = [
    "gymnasium>=0.29",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["wayfinders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "web"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RUF",
]
ignore = [
    "E501",  # line too long — formatter's job
    "B008",  # function call in default argument — fine for dataclass factories
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]
"scripts/**/*.py" = ["T201"]  # print() is fine in scripts

[tool.ruff.lint.isort]
known-first-party = ["wayfinders"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
files = ["wayfinders"]

[[tool.mypy.overrides]]
# Tests and scripts can be a notch looser; we still check them but don't gate on strict mode.
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
